<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qwen3 WebLLM catalog demo</title>
<style>
  :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
  body { max-width: 52rem; margin: 3rem auto; padding: 0 1rem; }
  textarea, pre { box-sizing: border-box; width: 100%; padding: .8rem; }
  textarea { min-height: 7rem; }
  pre { min-height: 8rem; white-space: pre-wrap; border: 1px solid #8888; }
  button { margin: 1rem 0; padding: .6rem 1rem; }
  #status { color: #777; }
</style>
<h1>Qwen3 — verified WebLLM/WebGPU</h1>
<p>
  Loads the catalog’s hash-pinned runtime and model library, then the
  revision-pinned upstream q4f16_1 weights. K=4 is used only for eligible
  temperature-zero requests.
</p>
<label for="prompt">Prompt</label>
<textarea id="prompt">Convert the quadratic formula to LaTeX.</textarea>
<div><button id="load">Load model</button> <button id="run" disabled>Generate</button></div>
<p id="status">Not loaded.</p>
<pre id="output"></pre>
<script type="module" src="./qwen.js"></script>
