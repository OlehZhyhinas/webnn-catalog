<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SD-Turbo on WebNN</title>
    <style>
      :root { color-scheme: dark; --bg: #101114; --fg: #e6e6e6; --dim: #8a8f98; --line: #2a2d34; --accent: #7bd88f; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: var(--bg); color: var(--fg);
             font: 14px/1.55 ui-sans-serif, -apple-system, system-ui, sans-serif; }
      main { max-width: 640px; margin: 0 auto; }
      h1 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
      .sub { color: var(--dim); font-size: 12px; margin-bottom: 20px; }
      form { display: flex; gap: 8px; margin-bottom: 16px; }
      input[type=text] { flex: 1; padding: 9px 11px; border-radius: 7px; border: 1px solid var(--line);
                         background: #17181c; color: var(--fg); font: inherit; }
      button { padding: 9px 16px; border-radius: 7px; border: 1px solid var(--line); background: #22242a;
               color: var(--fg); font: inherit; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      button:not(:disabled):hover { background: #2b2e36; }
      canvas { width: 100%; max-width: 512px; aspect-ratio: 1; display: block; border-radius: 8px;
               border: 1px solid var(--line); background: #17181c; image-rendering: auto; }
      table { border-collapse: collapse; margin-top: 16px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
      td { padding: 2px 14px 2px 0; }
      td:last-child { text-align: right; color: var(--accent); }
      #status { margin: 12px 0; color: var(--dim); font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
                white-space: pre-wrap; }
      .err { color: #ff8080; }
      progress { width: 100%; max-width: 512px; height: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>SD-Turbo, 512&times;512, one step</h1>
      <div class="sub" id="sub">loading the catalog index...</div>
      <p class="sub"><a href="./qwen.html">Open the Qwen3-0.6B WebLLM/WebGPU demo</a></p>

      <form id="form">
        <input id="prompt" type="text" value="a photo of a cat wearing sunglasses, studio lighting" />
        <button id="go" type="submit" disabled>Loading...</button>
      </form>

      <progress id="bar" max="100" value="0"></progress>
      <div id="status">starting...</div>
      <canvas id="canvas" width="512" height="512"></canvas>
      <table id="times"></table>
    </main>

    <script type="module">
      import { loadEntry, createEntryTensors, constantSource, assertCoreMLFingerprint } from "../runtime/loader.js";

      // Which entry to run comes from the URL, not from this page looking at
      // the machine. With no ?entry= it takes the first row in catalog.json,
      // which is a demo's convenience and not a recommendation: deciding which
      // entry suits a given visitor is a product's job, and the catalog has no
      // opinion about it.
      const params = new URLSearchParams(location.search);
      // With no ?weights= the constants come from wherever the manifest says
      // they are published, in the chunks it names. ?weights=/weights points at
      // a local mount instead, which is what serve.mjs --weights sets up and
      // what an unpublished entry needs.
      const WEIGHTS = params.get("weights") ?? null;

      const $ = (id) => document.getElementById(id);
      const status = (s, cls = "") => { $("status").textContent = s; $("status").className = cls; };
      const bar = (v) => { $("bar").value = v; };
      const j = (u) => fetch(u).then((r) => r.json());
      const buf = (u) => fetch(u).then((r) => r.arrayBuffer());

      /** NCHW -> NHWC on raw float16 bytes. */
      function nchwToNhwc16(b, C, H, W) {
        const src = new Uint16Array(b), dst = new Uint16Array(src.length), HW = H * W;
        for (let c = 0; c < C; c++) for (let p = 0; p < HW; p++) dst[p * C + c] = src[c * HW + p];
        return dst;
      }

      let rig = null;

      async function resolveEntryPath() {
        const named = params.get("entry");
        const catalog = await j("/catalog.json");
        const rows = Object.entries(catalog.families).flatMap(([fam, f]) =>
          f.entries.map((e) => ({ ...e, familyId: fam })));
        if (!rows.length) throw new Error("catalog.json indexes no entries");
        const row = named ? rows.find((r) => `${r.familyId}/${r.id}` === named) : rows[0];
        if (!row) throw new Error(`no entry "${named}". Known: ${rows.map((r) => `${r.familyId}/${r.id}`).join(", ")}`);
        return { path: `/${row.path}`, ref: `${row.familyId}/${row.id}` };
      }

      async function boot() {
        try {
          if (!navigator.ml) throw new Error("navigator.ml is missing. Enable WebNN: chrome://flags, or launch Chrome with --enable-features=WebMachineLearningNeuralNetwork,WebNNCoreML");
          const { path: entryPath, ref } = await resolveEntryPath();
          const entry = await j(`${entryPath}/entry.json`);
          $("sub").textContent = `entry ${ref}, variant ${entry.variant}. Built and tuned for ${entry.target.backend.name} on ${entry.target.host.chip ?? entry.target.gpu.vendor}, ${entry.target.os.name} ${entry.target.os.major}, ${entry.target.browser.name} ${entry.target.browser.major}.`;

          const ctx = await navigator.ml.createContext({ deviceType: entry.target.backend.deviceType ?? "gpu" });
          assertCoreMLFingerprint(ctx);
          status("backend: Core ML. fetching the entry...");

          const { default: ClipTokenizer } = await import(`/families/${entry.family}/tokenizer.js`);
          const manifest = await j(`${entryPath}/${entry.constants}`);

          // The image graph is 1650 MiB of constants and takes about 25 s to
          // compile; the text graph another 649 MiB and 19 s. Chromium has no
          // compiled-graph cache, so a reload pays this again.
          status("building the graphs (about 45 s of Core ML compilation; there is no cache)...");
          const loaded = await loadEntry(entry, WEIGHTS, ctx, {
            baseUrl: entryPath,
            onProgress: (p) => { if (p.phase === "constants") bar(90 * (p.bytesRead / p.totalBytes) * 0.5 + (p.graph === "text" ? 45 : 0)); },
          });
          bar(92);
          const image = loaded.graphs.image, text = loaded.graphs.text;

          status("tokenizer and latents...");
          const tok = await ClipTokenizer.load(`/families/${entry.family}/tokenizer/`);
          const [rawB, scaledB] = await Promise.all([
            buf(`${entryPath}/verification/latent_raw.f16.bin`),
            buf(`${entryPath}/verification/latent_scaled.f16.bin`),
          ]);

          // One tensor per operand, except the chain link entry.json declares:
          // the text graph's output IS the image graph's encoder_hidden_states,
          // so the embedding never crosses into JS. Outputs the entry marks
          // non-readable (the debug `latent`) are still allocated and bound.
          const tensors = await createEntryTensors(ctx, loaded);
          const inputIds = tensors.get("text", "input_ids");
          const embedding = tensors.get("text", "out");
          ctx.writeTensor(tensors.get("image", "sample"), nchwToNhwc16(scaledB, 4, 64, 64));
          ctx.writeTensor(tensors.get("image", "latent_raw"), nchwToNhwc16(rawB, 4, 64, 64));

          // The readback buffer is allocated once; the ImageData is a permanent
          // view over it, so "convert to pixels" is literally nothing.
          const host = new ArrayBuffer(512 * 512 * 4);
          const hostView = new Uint8Array(host);
          const imageData = new ImageData(new Uint8ClampedArray(host), 512, 512);
          const g2d = $("canvas").getContext("2d");

          rig = { ctx, loaded, image, text, tok, tensors, inputIds, embedding, hostView, imageData, g2d, lastIds: null };

          // Warm up: the very first dispatch pays a one-off ~250 ms.
          ctx.dispatch(text.graph, tensors.inputsFor("text"), tensors.outputsFor("text"));
          await ctx.readTensor(embedding);
          ctx.dispatch(image.graph, tensors.inputsFor("image"), tensors.outputsFor("image"));
          await ctx.readTensor(tensors.get("image", "out"), hostView);

          bar(100);
          status("ready.");
          $("go").disabled = false;
          $("go").textContent = "Generate";
          generate();
        } catch (e) {
          status(String(e.message ?? e), "err");
          throw e;
        }
      }

      async function generate() {
        if (!rig) return;
        $("go").disabled = true;
        const { ctx, image, text, tok } = rig;
        const t = {};
        const clock = () => performance.now();

        let t0 = clock();
        const enc = tok.encode($("prompt").value, 77);
        t.tokenize = clock() - t0;

        // Same prompt as last time? The embedding tensor still holds it.
        const same = rig.lastIds && enc.ids.every((v, i) => rig.lastIds[i] === v);
        if (!same) {
          t0 = clock();
          ctx.writeTensor(rig.inputIds, enc.ids);
          ctx.dispatch(text.graph, rig.tensors.inputsFor("text"), rig.tensors.outputsFor("text"));
          await ctx.readTensor(rig.embedding); // completion fence; the value stays on device
          t.textEncoder = clock() - t0;
          rig.lastIds = Array.from(enc.ids);
        }

        t0 = clock();
        ctx.dispatch(image.graph, rig.tensors.inputsFor("image"), rig.tensors.outputsFor("image"));
        await ctx.readTensor(rig.tensors.get("image", "out"), rig.hostView);
        t.imageGraph = clock() - t0;

        t0 = clock();
        rig.g2d.putImageData(rig.imageData, 0, 0);
        t.draw = clock() - t0;

        const total = Object.values(t).reduce((a, b) => a + b, 0);
        $("times").innerHTML =
          Object.entries({ ...t, total })
            .map(([k, v]) => `<tr><td>${k}${k === "textEncoder" ? "" : ""}</td><td>${v.toFixed(2)} ms</td></tr>`)
            .join("") + (same ? `<tr><td>text encoder</td><td>cached</td></tr>` : "");
        status(`${enc.nTokens} tokens${enc.truncated ? " (truncated to 77)" : ""}`);
        $("go").disabled = false;
      }

      $("form").addEventListener("submit", (e) => { e.preventDefault(); generate(); });
      boot();
    </script>
  </body>
</html>
